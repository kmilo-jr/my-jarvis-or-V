name: testes

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Preparar config local a partir do exemplo
        run: |
          if (-not (Test-Path config/default.json)) {
            Copy-Item config/default.example.json config/default.json
          }

      - name: Compilar codigo proprio
        run: |
          python -m compileall -q core brain voice ui personality integrations tests tools main.py main_dual_ui.py versao.py vlog.py secure_store.py

      - name: Suite de testes (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
